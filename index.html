<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlock Wiki – Heroes</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <meta name="description" content="Deadlock hero database: scaling tags, win rates, matchups and sources for every hero.">
  <meta name="theme-color" content="#0e0f11">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/itemization.css">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="#/"><img class="logo" src="assets/logo.png" alt="Deadlock Wiki logo"><span>Deadlock <span class="accent">Wiki</span></span></a>
      <nav class="topnav" aria-label="Site">
        <a class="navlink" data-nav="heroes" href="#/">Heroes</a>
        <a class="navlink" data-nav="items" href="#/itemization">Itemization</a>
        <span class="muted small hint">Press <span class="kbd">/</span> to search</span>
      </nav>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        Built by <a id="gh-link" href="#" target="_blank" rel="noopener">
        <span id="gh-name">JustGDX</span></a>
        <span id="gh-warning" class="warn" hidden>(placeholder – edit js/config.js)</span>
      </div>
      <div class="muted small">
        Data: <a href="https://deadlock.wiki" target="_blank" rel="noopener">Deadlock Wiki</a>,
        <a href="https://www.dexerto.com/wikis/deadlock/heroes/" target="_blank" rel="noopener">Dexerto</a>,
        <a href="https://deadlocklabs.gg" target="_blank" rel="noopener">Deadlock Labs</a>,
        items from <a href="https://deadlocker.gg/items" target="_blank" rel="noopener">Deadlocker</a>.
        Fan-made; not affiliated with Valve.
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/itemization.js"></script>
  <script src="js/item-details.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
